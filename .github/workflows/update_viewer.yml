name: Generate and Deploy 500mb Ensembles

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fix Runner DNS & Install Geospatial Libraries
        run: |
          # Fallback public DNS in case Azure runner DNS hiccups
          echo "nameserver 1.1.1.1" | sudo tee -a /etc/resolv.conf
          echo "nameserver 8.8.8.8" | sudo tee -a /etc/resolv.conf
          
          # Retry loop for package index update
          for i in {1..4}; do
            sudo apt-get update -o Acquire::Retries=3 && break || sleep 10
          done

          # Install system GIS requirements
          sudo apt-get install -y -o Acquire::Retries=3 \
            libgeos-dev libproj-dev proj-data proj-bin libeccodes-dev

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Packages
        run: |
          pip install --upgrade pip
          pip install herbie-data cartopy cfgrib eccodes xarray scipy matplotlib requests

      - name: Restore Multi-Run Archive
        uses: actions/cache@v4
        with:
          path: |
            output/runs
            backend_grids
          key: viewer-archive-${{ github.run_id }}
          restore-keys: |
            viewer-archive-

      - name: Run 500mb Generator
        run: |
          python generate_viewer.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
